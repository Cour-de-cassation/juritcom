---
- name: Create api Deployment
  k8s:
    apply: true
    state: present
    verify_ssl: true
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: '{{ api_app_id }}-deployment'
        namespace: '{{ juritcom_namespace }}'
        labels:
          app: '{{ api_app_id }}'
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: '{{ api_app_id }}'
        template:
          metadata:
            labels:
              app: '{{ api_app_id }}'
          spec:
            containers:
              - name: '{{ api_app_id }}'
                image: '{{ app_image }}'
                ports:
                  - containerPort: 3000
                livenessProbe:
                  httpGet:
                    path: /v1/health
                    port: 3000
                  initialDelaySeconds: 60
                  periodSeconds: 20
                  failureThreshold: 6
                envFrom:
                  - configMapRef:
                      name: 'api-config'
                  - secretRef:
                      name: 'api-secret'
                  - configMapRef:
                      name: 's3-config'
                  - secretRef:
                      name: 's3-secret'
